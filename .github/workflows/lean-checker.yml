# Builds the Lean checker image for proof boards (lean/), proves it on its own tests (a good proof
# passes; a different statement, a sorry and an extra axiom are each refused; a real Erdős statement
# builds), and only then publishes it, tagged by the library commit it checks against.
name: Lean checker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lean/**", ".github/workflows/lean-checker.yml"]

permissions:
  contents: read
  packages: write

env:
  LIB_REV: fd5c0ab5d1a77c2dfc6bd1102e40a350e6a02965
  IMAGE: ghcr.io/${{ github.repository_owner }}/commonplace-lean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Build the image
        run: docker build --build-arg LIB_REV=$LIB_REV -t checker lean
      - name: Test it
        run: |
          set -u
          expect() { # <case> <theorem> <true|false>
            out=$(docker run --rm --network none -v "$PWD/lean/test/$1:/in:ro" checker cp-check "$2")
            echo "$1: $out"
            ok=$(echo "$out" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["ok"]).lower())')
            [ "$ok" = "$3" ] || { echo "::error::$1 should have been ok=$3"; exit 1; }
          }
          expect good CpTest.cp_test true
          expect wrong CpTest.cp_test false
          expect sorry CpTest.cp_test false
          expect axiom CpTest.cp_test false
          # a real statement builds (and, proved by sorry, is refused for that reason only)
          out=$(docker run --rm --network none -v "$PWD/lean/test/erdos:/in:ro" checker cp-check Erdos1075.erdos_1075)
          echo "erdos: $out"
          echo "$out" | grep -q '"ok":false' || { echo "::error::a sorry proof of erdos_1075 passed"; exit 1; }
          echo "$out" | grep -qi 'sorry' || { echo "::error::erdos_1075 was refused for another reason than its sorry"; exit 1; }
      - name: Publish
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="$IMAGE:fc-${LIB_REV:0:12}"
          docker tag checker "$tag" && docker push "$tag"
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"
